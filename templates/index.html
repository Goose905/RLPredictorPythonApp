<!DOCTYPE html>
<html lang = "en">
    <style>
            /* used to design header text */
            headertext
            {
                color: yellow;
                font-size: 20px;
                background-color: black;
                /* Font of text */
                font-family: 'Courier New', Courier, monospace;
            }
            /* used to design general text on the website */
            generalText
            {
                color: red;
            }
            /* used to design input text boxs */
            input[type = "text"]
            {
                width: 180px;
                padding: 10px;
                border: 2px solid blue;
                border-radius: 8px;
                font-size: 16px;
                outline: none;
                transition: all 0.3s ease;
            }
            /* gives boxes a little bit of glow when clicked into */
            input[type = "text"]:focus
            {
                border-color: blue;
                box-shadow: 0 0 5px darkblue;
            }
            /* used to style button */
            button
            {
                /* Color of button */
                background-color: blue;
                /* Color of text in button */
                color: white;
                /* Size of button */
                padding: 10px 20px;
                /* Size of text */
                font-size: 16px;
                border: none;
                /* Rounds the corners of the button*/
                /* Greater number means more taken off of the corners */
                border-radius: 6px;
                /* changes the user's cursor to a pointer when hovering over the button*/
                cursor: pointer;
                /* Helps the button color transition not be as sharp*/
                transition: background-color 0.3s, transform 0.2s; 
            }
            /* Gives the button transition when the user hovers over it*/
            button:hover
            {
                background-color: #005fcc;
            }

            form#matchForm {
                display: flex;
                flex-direction: column;
                gap: 10px;
                align-items: center;

                >*{
                    width: 100%;
                }

                >select {
                    height: 5rem;
                }

                input[type="date"] {
                    padding: .5rem;
                    font-size: 1rem;
                    width: 30%;
                }
            }
            div#results {
                #clearButton {
                    position:absolute;
                    right: 2rem;
                    top: 1.5rem;
                }
            }
        </style>
    <head>
        <!-- This link allows for the use of semantic ui -->
        <link rel = "stylesheet" href = "https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css">
        <headerText> Rocket League: Fantasy Draft</headerText> <br>
    </head>
    <body>
        <div class = "ui raised segment" id = "teamsBox" style="width:75%; margin-left: auto; margin-right: auto;">
            <form id="matchForm" onsubmit="handleSubmit(event)">
                <label for="TeamOnePlayers">Team 1 line up:</label>
                <select id="TeamOnePlayers" name="TeamOnePlayers" multiple size="3">
                    {% for player in players %}
                        <option value="{{ player }}">{{ player }}</option>
                    {% endfor %}
                </select>
                <label for="TeamTwoPlayers">Team 2 line up:</label>
                <select id="TeamTwoPlayers" name="TeamTwoPlayers" multiple size="3">
                    {% for player in players %}
                        <option value="{{ player }}">{{ player }}</option>
                    {% endfor %}
                </select>
                <input type="date" id="matchDate" name="matchDate">
                <button type="submit">submit</button>
            </form>
        </div> 
        <div class="ui raised segment" id="results" style="text-align:center">
            <H1> Results: </H1>
            <button id="clearButton" onclick="clearResults()">Clear</button>
            
        </div>
    </body>
    <!-- Start of JS code -->
    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
                resultsDiv = document.getElementById("results");
                matchNumber = resultsDiv.children.length - 1;
                matchDate = formData.get('matchDate');
                teamOnePlayers = formData.getAll('TeamOnePlayers').map(player => encodeURIComponent(player)).join(', ');
                teamTwoPlayers = formData.getAll('TeamTwoPlayers').map(player => encodeURIComponent(player)).join(', ');
                resultsDiv.innerHTML += `<div><h3>Match ${matchNumber} Result:</h3>
                                         <p><a href="/match?date=${matchDate}&team1=${teamOnePlayers}&team2=${teamTwoPlayers}" target="_blank">View Match Details</a></p>
                                         <p>${formData.getAll('TeamOnePlayers').join(', ')} vs ${formData.getAll('TeamTwoPlayers').join(', ')}</p>
                                         <p>Predicted Winner: ${data.predicted_winner}</p><hr></div>`;
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        function clearResults() {
            resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = `<H1> Results: </H1>
                                    <button id="clearButton" onclick="clearResults()">Clear</button>`;
        }
    </script>
</html>
